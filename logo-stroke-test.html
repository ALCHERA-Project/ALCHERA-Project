<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Logo stroke test</title>
  <style>
    body {
      margin: 48px;
      background: #fff;
      color: #000038;
      font-family: sans-serif;
    }
    .stage {
      position: relative;
      width: min(920px, 100%);
    }
    .stage img,
    .stage svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .stage img {
      position: absolute;
      inset: 0;
      opacity: 0.2;
    }
    svg path {
      fill: none;
      stroke: #000038;
      stroke-width: 4.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    button {
      margin-top: 28px;
      padding: 8px 14px;
      border: 1px solid #000038;
      background: #fff;
      color: #000038;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img src="./assets/images/global/logo-b.svg" alt="">
    <svg id="logo" viewBox="0 0 180 27" overflow="visible" xmlns="http://www.w3.org/2000/svg">
      <path d="M13.175 -0.098 L3.032 25.444"/>
      <path d="M13.175 -0.098 L23.317 25.444"/>
      <path d="M29.39 -0.061 L29.39 21.4 Q29.39 23.168 31.4 23.168 L47.416 23.168"/>
      <path d="M71.51 2.216 L61.364 2.216 A10.417 10.417 0 0 0 50.947 12.691 A10.417 10.417 0 0 0 61.364 23.166 L71.51 23.166"/>
      <path d="M77.579 -0.061 L77.579 25.445"/>
      <path d="M77.579 11.472 L95.876 11.472"/>
      <path d="M95.876 -0.061 L95.876 25.445"/>
      <path d="M104.197 -0.098 L104.197 25.447"/>
      <path d="M104.197 2.183 L124.774 2.183"/>
      <path d="M104.197 11.452 L124.774 11.452"/>
      <path d="M104.197 23.167 L124.774 23.167"/>
      <path d="M130.844 -0.098 L130.844 25.444"/>
      <path d="M130.844 2.183 L144 2.183 C147.6 2.183 149 4.2 149 6.816 C149 9.2 147 11.451 142 11.451 L133.1 11.451"/>
      <path d="M141.8 11.451 L148.73 25.444"/>
      <path d="M166.487 -0.098 L156.345 25.444"/>
      <path d="M166.487 -0.098 L176.63 25.444"/>
    </svg>
  </div>
  <button type="button" id="replay">다시 그리기</button>
  <script>
    const paths = document.querySelectorAll("#logo path");

    function play() {
      paths.forEach((path, index) => {
        const length = path.getTotalLength();
        path.style.transition = "none";
        path.style.strokeDasharray = length;
        path.style.strokeDashoffset = length;
        path.getBoundingClientRect();
        path.style.transition = "stroke-dashoffset 0.42s ease " + (index * 0.07) + "s";
        path.style.strokeDashoffset = "0";
      });
    }

    play();
    document.getElementById("replay").addEventListener("click", play);
  </script>
</body>
</html>
